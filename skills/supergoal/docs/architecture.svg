<svg viewBox="0 0 1220 1730" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f85149"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d29922"/></marker>
  </defs>

  <rect x="0" y="0" width="1220" height="1730" fill="#0d1117"/>

  <text x="48" y="58" font-size="28" font-weight="700" fill="#e6edf3">Supergoal</text>
  <text x="48" y="86" font-size="14" fill="#8b949e">Plan samen, bouw zelfstandig, laat een onafhankelijke controleur het bewijzen. Stap voor stap. Een skill voor Claude Code en Codex.</text>

  <!-- band bars + labels -->
  <rect x="300" y="120" width="3" height="72" rx="1.5" fill="#6e7681"/>
  <text x="120" y="162" font-size="11" font-weight="700" fill="#6e7681" letter-spacing="1">OPZET</text>

  <rect x="300" y="204" width="3" height="618" rx="1.5" fill="#d29922"/>
  <text x="120" y="246" font-size="11" font-weight="700" fill="#d29922" letter-spacing="1">PLAN MET JOU</text>
  <text x="120" y="262" font-size="10" fill="#8b6d1f">twee keer beslis jij</text>

  <rect x="300" y="834" width="3" height="218" rx="1.5" fill="#388bfd"/>
  <text x="120" y="876" font-size="11" font-weight="700" fill="#388bfd" letter-spacing="1">STARTEN</text>

  <rect x="300" y="1064" width="3" height="610" rx="1.5" fill="#3fb950"/>
  <text x="120" y="1106" font-size="11" font-weight="700" fill="#3fb950" letter-spacing="1">ZELFSTANDIGE RUN</text>

  <!-- Stage 0 -->
  <rect x="320" y="124" width="560" height="64" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="142" width="78" height="22" rx="11" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
  <text x="377" y="157" text-anchor="middle" font-size="11" font-weight="700" fill="#adbac7">Stap 0</text>
  <text x="430" y="150" font-size="15" font-weight="600" fill="#e6edf3">Context laden</text>
  <text x="430" y="172" font-size="12" fill="#8b949e">geheugen inladen, kijken welk gereedschap er is (hulp-agents, app draaien), een run hervatten</text>
  <line x1="600" y1="188" x2="600" y2="208" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 1 -->
  <rect x="320" y="208" width="560" height="88" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <rect x="338" y="226" width="78" height="22" rx="11" fill="#3a2d12" stroke="#d29922" stroke-width="1"/>
  <text x="377" y="241" text-anchor="middle" font-size="11" font-weight="700" fill="#e3b341">Stap 1</text>
  <rect x="772" y="226" width="90" height="22" rx="11" fill="#3a2d12" stroke="#d29922" stroke-width="1"/>
  <text x="817" y="241" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e3b341">jij beslist</text>
  <text x="430" y="241" font-size="15" font-weight="600" fill="#e6edf3">Samen plannen</text>
  <text x="338" y="266" font-size="12" fill="#8b949e">vragen tot we hetzelfde beeld hebben, een scherpe vraag per keer met een aanbeveling</text>
  <rect x="338" y="274" width="248" height="16" rx="8" fill="#2a1f3d"/>
  <text x="346" y="286" font-size="10.5" font-weight="600" fill="#a371f7">adviesraad (council) bij een zware keuze</text>
  <line x1="600" y1="296" x2="600" y2="316" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 2 -->
  <rect x="320" y="316" width="560" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="334" width="78" height="22" rx="11" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
  <text x="377" y="349" text-anchor="middle" font-size="11" font-weight="700" fill="#adbac7">Stap 2</text>
  <text x="430" y="349" font-size="15" font-weight="600" fill="#e6edf3">Info verzamelen</text>
  <text x="338" y="372" font-size="11.5" fill="#8b949e">zoekvraag scherpstellen, dan tegelijk in vier bronnen zoeken:</text>
  <rect x="338" y="382" width="120" height="28" rx="7" fill="#1c2128" stroke="#39414c"/>
  <text x="398" y="400" text-anchor="middle" font-size="11.5" fill="#adbac7">Code</text>
  <rect x="466" y="382" width="120" height="28" rx="7" fill="#1c2128" stroke="#39414c"/>
  <text x="526" y="400" text-anchor="middle" font-size="11.5" fill="#adbac7">Docs</text>
  <rect x="594" y="382" width="120" height="28" rx="7" fill="#1c2128" stroke="#39414c"/>
  <text x="654" y="400" text-anchor="middle" font-size="11" fill="#adbac7">koppelingen (MCP's)</text>
  <rect x="722" y="382" width="120" height="28" rx="7" fill="#1c2128" stroke="#39414c"/>
  <text x="782" y="400" text-anchor="middle" font-size="11.5" fill="#adbac7">Skills</text>
  <rect x="338" y="424" width="232" height="46" rx="8" fill="#12261a" stroke="#2ea043" stroke-width="1.3"/>
  <text x="454" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#56d364">Genoeg info?</text>
  <text x="454" y="460" text-anchor="middle" font-size="10.5" fill="#6e9e78">beoordeelt of het compleet is</text>
  <rect x="610" y="424" width="232" height="46" rx="8" fill="#2a1518" stroke="#da3633" stroke-width="1.3"/>
  <text x="726" y="444" text-anchor="middle" font-size="12" font-weight="600" fill="#f85149">Zoekt een gat</text>
  <text x="726" y="460" text-anchor="middle" font-size="10.5" fill="#b86a68">tegencontrole die gaten zoekt</text>
  <path d="M 610 447 L 580 447" stroke="#6e7681" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="888" y="406" font-size="10.5" fill="#8b949e" transform="rotate(90 888 406)">zoekronde herhaalt, max 3x</text>
  <line x1="600" y1="486" x2="600" y2="506" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 3 -->
  <rect x="320" y="506" width="560" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="522" width="78" height="22" rx="11" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
  <text x="377" y="537" text-anchor="middle" font-size="11" font-weight="700" fill="#adbac7">Stap 3</text>
  <text x="430" y="531" font-size="15" font-weight="600" fill="#e6edf3">Plan maken</text>
  <text x="430" y="550" font-size="12" fill="#8b949e">een plan uit de verzamelde info</text>
  <line x1="600" y1="562" x2="600" y2="582" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 4 -->
  <rect x="320" y="582" width="560" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="598" width="78" height="22" rx="11" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
  <text x="377" y="613" text-anchor="middle" font-size="11" font-weight="700" fill="#adbac7">Stap 4</text>
  <text x="430" y="607" font-size="15" font-weight="600" fill="#e6edf3">Plan opdelen in fasen</text>
  <text x="430" y="626" font-size="12" fill="#8b949e">elke fase op zichzelf te controleren, door het echt te draaien</text>
  <line x1="600" y1="638" x2="600" y2="658" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 5 -->
  <rect x="320" y="658" width="560" height="56" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="674" width="78" height="22" rx="11" fill="#21262d" stroke="#6e7681" stroke-width="1"/>
  <text x="377" y="689" text-anchor="middle" font-size="11" font-weight="700" fill="#adbac7">Stap 5</text>
  <text x="430" y="683" font-size="15" font-weight="600" fill="#e6edf3">Stappenplan en fase-omschrijvingen</text>
  <text x="430" y="702" font-size="12" fill="#8b949e">met waarom-uitleg per fase en de afgewogen alternatieven</text>
  <line x1="600" y1="714" x2="600" y2="734" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 6 -->
  <rect x="320" y="734" width="560" height="88" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <rect x="338" y="752" width="78" height="22" rx="11" fill="#3a2d12" stroke="#d29922" stroke-width="1"/>
  <text x="377" y="767" text-anchor="middle" font-size="11" font-weight="700" fill="#e3b341">Stap 6</text>
  <rect x="772" y="752" width="90" height="22" rx="11" fill="#3a2d12" stroke="#d29922" stroke-width="1"/>
  <text x="817" y="767" text-anchor="middle" font-size="10.5" font-weight="700" fill="#e3b341">jij beslist</text>
  <text x="430" y="767" font-size="15" font-weight="600" fill="#e6edf3">Plan goedkeuren</text>
  <text x="338" y="792" font-size="12" fill="#8b949e">het beslismoment: zelfcontrole, een losse reviewpagina, een samenvatting.</text>
  <text x="338" y="810" font-size="12" fill="#8b949e">Jij keurt goed. Dit is de enige stop in de hele run.</text>
  <line x1="600" y1="822" x2="600" y2="842" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 6.5 -->
  <rect x="320" y="842" width="560" height="54" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="857" width="78" height="22" rx="11" fill="#11233f" stroke="#388bfd" stroke-width="1"/>
  <text x="377" y="872" text-anchor="middle" font-size="11" font-weight="700" fill="#6cb1ff">Stap 6.5</text>
  <text x="430" y="866" font-size="15" font-weight="600" fill="#e6edf3">Snelle test vooraf</text>
  <text x="430" y="884" font-size="12" fill="#8b949e">draai de verplichte checks op de uitgangsversie, leg het startpunt vast</text>
  <line x1="600" y1="896" x2="600" y2="914" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 6.6 -->
  <rect x="320" y="914" width="560" height="60" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="338" y="931" width="78" height="22" rx="11" fill="#11233f" stroke="#388bfd" stroke-width="1"/>
  <text x="377" y="946" text-anchor="middle" font-size="11" font-weight="700" fill="#6cb1ff">Stap 6.6</text>
  <text x="430" y="940" font-size="15" font-weight="600" fill="#e6edf3">Werkvorm kiezen</text>
  <text x="430" y="960" font-size="12" fill="#8b949e">werkvorm en zwaarte per fase, met /goal of /loop naar behoefte en budget</text>
  <line x1="600" y1="974" x2="600" y2="992" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <!-- Stage 7 -->
  <rect x="320" y="992" width="560" height="60" rx="10" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="338" y="1009" width="78" height="22" rx="11" fill="#11233f" stroke="#388bfd" stroke-width="1"/>
  <text x="377" y="1024" text-anchor="middle" font-size="11" font-weight="700" fill="#6cb1ff">Stap 7</text>
  <text x="430" y="1018" font-size="15" font-weight="600" fill="#e6edf3">Starten: een regel plakken</text>
  <text x="430" y="1038" font-size="12" fill="#8b949e">jij plakt de kant-en-klare regel, daarna draait het zelf</text>
  <line x1="600" y1="1052" x2="600" y2="1072" stroke="#6e7681" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- ZELFSTANDIGE RUN -->
  <rect x="280" y="1072" width="640" height="582" rx="14" fill="#0f141b" stroke="#2b3440" stroke-width="1.5"/>
  <text x="304" y="1100" font-size="14" font-weight="700" fill="#adbac7">De bouwer bouwt, de controleur bewijst, de adviesraad bewaakt de richting</text>
  <text x="304" y="1118" font-size="11.5" fill="#6e7681">een ronde per fase, tot de hele klus klaar is</text>

  <rect x="340" y="1132" width="520" height="64" rx="10" fill="#11233f" stroke="#388bfd" stroke-width="1.5"/>
  <text x="600" y="1157" text-anchor="middle" font-size="14.5" font-weight="700" fill="#e6edf3">Bouwer, standaard een team</text>
  <text x="600" y="1177" text-anchor="middle" font-size="11.5" fill="#9bbcf0">een specialist per onderdeel, tegelijk; levert ruw bewijs, geen oordeel</text>
  <line x1="600" y1="1196" x2="600" y2="1216" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <rect x="320" y="1218" width="560" height="84" rx="10" fill="#0c2a2c" stroke="#39c5cf" stroke-width="2"/>
  <text x="600" y="1245" text-anchor="middle" font-size="16" font-weight="700" fill="#76e3ea">Onafhankelijke controleur</text>
  <text x="600" y="1265" text-anchor="middle" font-size="12" fill="#9fd6da">begint blanco, herdraait elke check door de echte app te draaien</text>
  <text x="600" y="1285" text-anchor="middle" font-size="12.5" font-weight="700" fill="#76e3ea">goedgekeurd of afgekeurd</text>

  <path d="M 320 1260 L 300 1260 L 300 1164 L 340 1164" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="294" y="1244" font-size="10" font-weight="600" fill="#f85149" transform="rotate(-90 294 1244)">afgekeurd: tot 3x herstellen, anders terug naar de laatste werkende versie</text>

  <line x1="600" y1="1302" x2="600" y2="1322" stroke="#3fb950" stroke-width="2.5" marker-end="url(#ag)"/>
  <text x="612" y="1316" font-size="11.5" font-weight="700" fill="#3fb950">goedgekeurd</text>

  <!-- council direction gate -->
  <rect x="340" y="1324" width="520" height="66" rx="10" fill="#1c1530" stroke="#a371f7" stroke-width="1.8"/>
  <text x="600" y="1349" text-anchor="middle" font-size="14.5" font-weight="700" fill="#c8a6ff">Adviesraad checkt de richting</text>
  <text x="600" y="1369" text-anchor="middle" font-size="11.5" fill="#a78bd0">klopt de koers? meestal gaat het automatisch door</text>
  <text x="600" y="1384" text-anchor="middle" font-size="10.5" fill="#8a78b0">alleen bij een zware koerskeuze vraagt hij jou</text>

  <!-- escalation branch to human -->
  <path d="M 860 1357 L 900 1357 L 900 1357 L 936 1357" fill="none" stroke="#d29922" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#am)"/>
  <rect x="938" y="1322" width="244" height="72" rx="10" fill="#2a2112" stroke="#d29922" stroke-width="1.5"/>
  <text x="1060" y="1346" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e3b341">Jij: go / B / C</text>
  <text x="1060" y="1364" text-anchor="middle" font-size="10.5" fill="#c9a23a">de raad raadt A aan, je hebt ook B en C,</text>
  <text x="1060" y="1378" text-anchor="middle" font-size="10.5" fill="#c9a23a">met de bronnen erbij. go volgt de raad.</text>

  <line x1="600" y1="1390" x2="600" y2="1410" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <rect x="360" y="1410" width="480" height="48" rx="9" fill="#161b22" stroke="#30363d" stroke-width="1.3"/>
  <text x="600" y="1439" text-anchor="middle" font-size="12.5" fill="#adbac7">geheugen bijwerken, fase klaar, door naar de volgende fase</text>
  <line x1="600" y1="1458" x2="600" y2="1478" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <rect x="340" y="1478" width="520" height="58" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="1503" text-anchor="middle" font-size="14" font-weight="600" fill="#e6edf3">Eindcontrole</text>
  <text x="600" y="1522" text-anchor="middle" font-size="11.5" fill="#8b949e">na de laatste fase, alles opnieuw tegen het oorspronkelijke plan</text>
  <line x1="600" y1="1536" x2="600" y2="1556" stroke="#6e7681" stroke-width="2" marker-end="url(#a)"/>

  <rect x="490" y="1556" width="220" height="54" rx="11" fill="#12261a" stroke="#3fb950" stroke-width="2"/>
  <text x="600" y="1590" text-anchor="middle" font-size="17" font-weight="700" fill="#56d364">Klaar</text>
</svg>
