<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 214" width="1200" height="214" role="img" aria-label="Commit-checks, push-checks, PR-gate, CI"><title>Commit-checks, push-checks, PR-gate, CI</title><style>
